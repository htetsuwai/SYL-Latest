[build]
  publish = "."

# Auth and data go through the edge proxy. The Supabase URL and anon key
# stay in Netlify environment variables (SUPABASE_URL, SUPABASE_ANON_KEY).
[[edge_functions]]
  function = "supabase-proxy"
  path = "/supabase/*"

# Existing files (JS/CSS) are served as-is. Only missing paths fall back to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
